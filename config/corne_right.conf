# Replaces the built-in status screen with a custom one that shows the
# keypress animation (see ../src/keypress_anim_status_screen.c), driven
# remotely by the central half on every keypress from either half.
CONFIG_ZMK_WIDGET_KEYPRESS_ANIM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
